<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="FindGT detection boundary">
  <defs>
    <style>
      .title { font: 20px 'Segoe UI Semibold', Arial, sans-serif; fill: #0f2f44; }
      .box { stroke-width: 2; rx: 12; ry: 12; }
      .obs { fill: #eef9f0; stroke: #2f7d42; }
      .enc { fill: #fff5f3; stroke: #9b4b3f; }
      .txt { font: 16px 'Segoe UI', Arial, sans-serif; fill: #12324a; }
      .small { font: 14px 'Segoe UI', Arial, sans-serif; fill: #12324a; }
      .arrow { stroke: #2b5f8a; stroke-width: 2; marker-end: url(#m); }
      .dash { stroke-dasharray: 6 5; }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b5f8a" />
    </marker>
  </defs>

  <text x="20" y="34" class="title">FindGT Boundary: what we can observe safely on endpoints</text>

  <rect x="20" y="70" width="560" height="300" class="box obs"/>
  <text x="40" y="104" class="txt">Observable on endpoint</text>
  <text x="40" y="136" class="small">- LSASS sessions</text>
  <text x="40" y="162" class="small">- token groups (SIDs)</text>
  <text x="40" y="188" class="small">- token vs authoritative diff</text>

  <rect x="620" y="70" width="560" height="300" class="box enc"/>
  <text x="640" y="104" class="txt">Encrypted / high-risk to expose broadly</text>
  <text x="640" y="136" class="small">- encrypted ticket internals (TGT/TGS)</text>
  <text x="640" y="162" class="small">- KRBTGT and service long-term keys</text>
  <text x="640" y="188" class="small">- mass endpoint decryption workflows</text>

  <rect x="190" y="248" width="220" height="78" class="box obs"/>
  <text x="208" y="282" class="txt">FindGT decision</text>
  <text x="208" y="306" class="small">suspicious SID mismatch</text>

  <line x1="510" y1="286" x2="620" y2="286" class="arrow dash"/>
  <text x="520" y="272" class="small">avoid broad decryption</text>
</svg>
